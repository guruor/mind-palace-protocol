name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Verify release tag and ancestry
        shell: sh
        run: |
          uv run --frozen scripts/validate_release.py "$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$release_commit" origin/main

      - name: Validate protocol release
        run: uv run --frozen scripts/validate.py

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish GitHub Release
        shell: sh
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --title "Mind Palace Protocol $GITHUB_REF_NAME"
